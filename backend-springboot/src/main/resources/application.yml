server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: double-recording

  # H2 内存数据库,开箱即用,无需安装 MySQL
  datasource:
    url: jdbc:h2:mem:double_recording;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password: sa

  jpa:
    hibernate:
      ddl-auto: none  # 用 schema.sql 手动建表
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
      encoding: UTF-8

  # 缓存(Caffeine 本地缓存,代替 Redis)
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,expireAfterWrite=60s

  # H2 Web Console (开发用,生产关闭)
  h2:
    console:
      enabled: true
      path: /h2-console

# 应用配置
app:
  double-recording:
    # 双录会话状态保留时长(分钟)
    session-keep-minutes: 30
    # 视频存储路径(本地)
    video-storage-path: ${user.home}/double-recording-videos
    # 区块链存证模拟(可换成真实区块链)
    chain-mock-enabled: true
    # 演示模式:跳过 WebRTC 和 CA 真实调用
    demo-mode: true

# 日志
logging:
  level:
    root: INFO
    com.mavis.doublerecording: DEBUG
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
