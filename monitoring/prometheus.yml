global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Spring Boot Actuator 端点
  - job_name: 'airecord'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['airecord:8080']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Prometheus 自身监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
